[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-statusline"
dynamic = ["version"]
description = "A compact two-line status line for Claude Code (context, model, rate limits, cost)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Maggi", email = "andrea@maggicontrols.com" }]
keywords = ["claude", "claude-code", "statusline", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Maggi-Controls-S-R-L/claude-statusline"
Issues = "https://github.com/Maggi-Controls-S-R-L/claude-statusline/issues"

[project.scripts]
claude-statusline = "statusline:main"

# PEP 735 — development-only dependencies (not public package extras).
[dependency-groups]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

# Single source of truth: the version is read from __version__ in statusline.py
# (keeps the standalone script and the package metadata in sync).
[tool.hatch.version]
path = "statusline.py"

# Single-module project: the distribution name (claude-statusline) differs from
# the module (statusline.py), so the file to ship must be listed explicitly.
[tool.hatch.build.targets.wheel]
include = ["statusline.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
